<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="General" />


<f:section name="content">
    <!--TYPO3SEARCH_end-->
    <f:if condition="{news}">
        <f:then>
            <div class="news-list-view" id="news-container-{contentObjectData.uid}">
                <f:if condition="{settings.hidePagination}">
                    <f:then>
                        <f:render section="items" arguments="{items: news, settings: settings}" />
                    </f:then>
                    <f:else>
                        <f:if condition="{settings.list.paginate.insertAbove}">
                            <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                        </f:if>
                        <f:render section="items" arguments="{items: pagination.paginator.paginatedItems, settings: settings}" />
                        <f:if condition="{settings.list.paginate.insertBelow}">
                            <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                        </f:if>
                    </f:else>
                </f:if>
            </div>
        </f:then>
        <f:else>
            <div class="alert alert-info">
                <f:translate key="list_nonewsfound" />
            </div>
        </f:else>
    </f:if>
    <!--TYPO3SEARCH_begin-->
</f:section>


<f:section name="items">
    <f:if condition="{settings.templateLayout} == 10">
        <f:then>
            <!-- Layout 1: Kacheln – 1 Spalte mobil, 2 ab md, 3 ab lg -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-3">
                <f:for each="{items}" as="newsItem" iteration="iterator">
                    <div class="col">
                        <f:render partial="List/KWMItem" arguments="{newsItem: newsItem, settings: settings, iterator: iterator}" />
                    </div>
                </f:for>
            </div>
        </f:then>
        <f:else>
            <!-- Standard: Liste untereinander -->
            <ul class="list-group mb-3">
                <f:for each="{items}" as="newsItem" iteration="iterator">
                    <f:render partial="List/Item" arguments="{newsItem: newsItem, settings: settings, iterator: iterator}" />
                </f:for>
            </ul>
        </f:else>
    </f:if>
</f:section>
</html>
