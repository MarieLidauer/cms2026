<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Preview"/>

<f:section name="Header">
    <cb:link.editRecord uid="{data.uid}" table="{data.mainType}">{data.header}</cb:link.editRecord>
</f:section>

<f:section name="Content">
    <f:for each="{data.image}" as="file">
        <f:image image="{file}" />
    </f:for>
    {data -> f:render.text(field: 'header')}
    {data -> f:render.text(field: 'bodytext')}
    <f:link.typolink parameter="{data.link}">Link</f:link.typolink>
    {data -> f:render.text(field: 'fhooe_kwmcard_linktext')}
</f:section>

<f:comment>
<!-- Uncomment to override preview footer -->
<f:section name="Footer">
    My custom Footer
</f:section>
</f:comment>
</html>
